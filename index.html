<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Newsflow Agro</title>
<meta name="theme-color" content="#1d3b2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Newsflow Agro">
<style>
  :root{
    --bg:#f6f5f1; --surface:#ffffff; --ink:#1f1e1b; --ink-3:#8a8677;
    --line:#e5e2d9; --accent:#1d3b2a; --accent-ink:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#191817; --surface:#232220; --ink:#eceae4; --ink-3:#807c6f;
      --line:#38362f; --accent:#2f5c42; --accent-ink:#f2f0ea;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
  header{background:var(--accent);color:var(--accent-ink);padding:calc(env(safe-area-inset-top, 0px) + 12px) 16px 0;flex-shrink:0}
  .title-row{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px}
  .title{font-size:17px;font-weight:700;letter-spacing:.02em}
  .title small{opacity:.75;font-weight:500;font-size:12px;margin-left:8px}
  button.refresh{background:rgba(255,255,255,.14);color:var(--accent-ink);border:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
  nav{display:flex;gap:4px}
  nav button{flex:1;background:transparent;color:var(--accent-ink);border:none;opacity:.65;padding:10px 8px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
  nav button.active{opacity:1;border-bottom-color:var(--accent-ink)}
  main{flex:1;position:relative;overflow:hidden}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--bg);display:none}
  iframe.active{display:block}
</style>
</head>
<body>
  <header>
    <div class="title-row">
      <div class="title">🐂 Newsflow Agro<small>BGI · SJC · CCM · ICF</small></div>
      <button class="refresh" onclick="reloadAll()" aria-label="Atualizar">↻</button>
    </div>
    <nav>
      <button id="tab-noticias" class="active" onclick="show('noticias')">📰 Notícias</button>
      <button id="tab-dados" onclick="show('dados')">📊 Cotações</button>
    </nav>
  </header>
  <main>
    <iframe id="frame-noticias" class="active" title="Notícias"></iframe>
    <iframe id="frame-dados" title="Cotações"></iframe>
  </main>
<script>
  function bust(page){ return page + '.html?t=' + Date.now(); }
  function load(name){ document.getElementById('frame-'+name).src = bust(name==='noticias'?'noticias':'dados'); }
  function show(name){
    ['noticias','dados'].forEach(function(n){
      document.getElementById('tab-'+n).classList.toggle('active', n===name);
      document.getElementById('frame-'+n).classList.toggle('active', n===name);
    });
  }
  function reloadAll(){ load('noticias'); load('dados'); }
  reloadAll();
  setInterval(reloadAll, 10*60*1000); // recarrega a cada 10 min
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) reloadAll(); });
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
