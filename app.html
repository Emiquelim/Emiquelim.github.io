<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Newsflow Agro</title>
<meta name="theme-color" content="#1d3b2a">
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Newsflow Agro">
<style>
  :root{
    --bg:#f6f5f1; --ink:#1f1e1b; --accent:#1d3b2a; --accent-ink:#ffffff; --muted:#8a8677;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#191817; --ink:#eceae4; --accent:#2f5c42; --accent-ink:#f2f0ea; --muted:#807c6f; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
  header{background:var(--accent);color:var(--accent-ink);padding:calc(env(safe-area-inset-top, 0px) + 12px) 16px 0;flex-shrink:0}
  .title-row{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;gap:10px}
  .title{font-size:17px;font-weight:700;letter-spacing:.02em}
  .title small{opacity:.75;font-weight:500;font-size:12px;margin-left:8px}
  .status{font-size:11px;opacity:.8;padding-bottom:8px}
  button.refresh{background:rgba(255,255,255,.16);color:var(--accent-ink);border:none;border-radius:8px;padding:7px 14px;font-size:15px;font-weight:700;cursor:pointer}
  nav{display:flex;gap:4px}
  nav button{flex:1;background:transparent;color:var(--accent-ink);border:none;opacity:.65;padding:10px 8px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
  nav button.active{opacity:1;border-bottom-color:var(--accent-ink)}
  main{flex:1;position:relative;overflow:hidden}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--bg);display:none}
  iframe.active{display:block}
  .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
  <header>
    <div class="title-row">
      <div class="title">🐂 Newsflow Agro<small>BGI · SJC · CCM · ICF</small></div>
      <button class="refresh" onclick="loadAll(true)" aria-label="Atualizar">↻</button>
    </div>
    <div class="status" id="status">carregando…</div>
    <nav>
      <button id="tab-noticias" class="active" onclick="show('noticias')">📰 Notícias</button>
      <button id="tab-dados" onclick="show('dados')">📊 Cotações</button>
    </nav>
  </header>
  <main>
    <iframe id="frame-noticias" class="active" title="Notícias"></iframe>
    <iframe id="frame-dados" title="Cotações"></iframe>
    <div class="msg" id="msg" style="display:none"></div>
  </main>
<script>
  // Lê os painéis direto do repositório (raw), evitando o cache do GitHub Pages.
  var BASE = 'https://raw.githubusercontent.com/Emiquelim/Emiquelim.github.io/main/';
  var loading = false;

  function setStatus(t){ document.getElementById('status').textContent = t; }

  function fetchPanel(name){
    return fetch(BASE + name + '.html?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
      .then(function(html){ document.getElementById('frame-'+name).srcdoc = html; return true; });
  }

  function loadAll(manual){
    if(loading) return;
    loading = true;
    setStatus(manual ? 'atualizando…' : 'carregando…');
    Promise.all([fetchPanel('noticias'), fetchPanel('dados')])
      .then(function(){
        var d = new Date();
        var hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
        setStatus('conteúdo carregado às ' + hh + ':' + mm + ' — toque em ↻ para atualizar');
        document.getElementById('msg').style.display = 'none';
      })
      .catch(function(e){
        setStatus('falha ao carregar (' + e.message + ')');
        var m = document.getElementById('msg');
        m.textContent = 'Não consegui carregar os painéis agora. Verifique a conexão e toque em ↻.';
        m.style.display = 'flex';
      })
      .then(function(){ loading = false; });
  }

  function show(name){
    ['noticias','dados'].forEach(function(n){
      document.getElementById('tab-'+n).classList.toggle('active', n===name);
      document.getElementById('frame-'+n).classList.toggle('active', n===name);
    });
  }

  // Limpa service worker e caches da versão antiga do app (que ficavam presos em conteúdo velho)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); });
  }
  if (window.caches && caches.keys) {
    caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); });
  }

  loadAll(false);
  setInterval(function(){ loadAll(false); }, 5*60*1000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) loadAll(false); });
</script>
</body>
</html>
